<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Geo-Lo • Set your password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#071a13;--muted:#93b3a5;--text:#e6f2ec;--primary:#10b981;--card:rgba(15,35,26,0.88);--border:1px solid rgba(147,179,165,0.18);--shadow:0 20px 40px rgba(2,20,12,0.5);--radius:18px}
        body.light{--bg:#eafaf1;--muted:#5c7d6e;--text:#10251b;--primary:#16a34a;--card:rgba(255,255,255,0.92);--border:1px solid rgba(22,163,74,0.16);--shadow:0 16px 36px rgba(16,80,50,0.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:radial-gradient(1200px 600px at 10% 10%,#0b3b2a 0%,var(--bg) 42%),radial-gradient(800px 400px at 90% 10%,#064e3b 0%,transparent 45%);min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;color:var(--text)}
        body.light{background:radial-gradient(1200px 600px at 10% 10%,#bbf7d0 0%,var(--bg) 42%),radial-gradient(800px 400px at 90% 10%,#a7f3d0 0%,transparent 45%)}
        .container{width:100%;max-width:480px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:var(--border)}
        .header{padding:24px 20px;text-align:center;background:linear-gradient(90deg,rgba(16,163,74,.15),rgba(16,163,74,.05))}
        .header h1{font-size:24px;margin-bottom:8px;font-weight:700}
        .header p{font-size:14px;color:var(--muted)}
        .content{padding:28px}
        .hint{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
        .input{width:100%;padding:16px 18px;border:2px solid rgba(147,179,165,.2);border-radius:14px;margin-bottom:18px;font-size:16px;background:rgba(255,255,255,.06);color:var(--text)}
        body.light .input{background:rgba(22,163,74,.05);border-color:rgba(22,163,74,.18)}
        .input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(16,163,74,.15)}
        .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}
        .link{margin-top:14px;text-align:center;font-size:13px}
        .link a{color:var(--primary);text-decoration:none;font-weight:600}
        .message{padding:14px;border-radius:14px;margin-bottom:18px;text-align:center;display:none;font-weight:600}
        .message.error{background:#f8d7da;color:#721c24;display:block}
        .message.success{background:#dcfce7;color:#166534;display:block}
        .input-with-icon{position:relative}
        .input-with-icon input{padding-right:44px}
        .toggle-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--muted);padding:6px}
    </style>
</head>
<body class="light">
    <div class="container">
        <div class="header">
            <h1>Set your new password</h1>
            <p>This account is still on the password it was created with</p>
        </div>
        <div class="content">
            <div id="msg" class="message"></div>
            <p class="hint" id="intro">Choose a password only you know. You will be signed out of other devices.</p>
            <div class="input-with-icon">
                <input type="password" class="input" id="newPassword" placeholder="New password (8+ characters)" autocomplete="new-password" />
                <button type="button" class="toggle-btn" data-toggle="newPassword">👁️</button>
            </div>
            <div class="input-with-icon">
                <input type="password" class="input" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" />
                <button type="button" class="toggle-btn" data-toggle="confirmPassword">👁️</button>
            </div>
            <button class="btn" id="saveBtn" type="button">Save and continue</button>
            <div class="link"><a href="#" id="forgotLink">I’d rather reset with an emailed code</a></div>
        </div>
    </div>
    <script src="session.js?v=20261107a"></script>
    <script>
        (function () {
            const theme = localStorage.getItem('geo_theme') || 'light';
            document.body.classList.toggle('light', theme === 'light');
        })();

        const loginPage = /super-login|owner-login/.test(document.referrer)
            ? GeoSession.siteUrl('owner-login.html')
            : 'admin-login.html';
        document.getElementById('forgotLink').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = GeoSession.siteUrl('reset.html');
        });
        document.querySelectorAll('.toggle-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const input = document.getElementById(btn.dataset.toggle);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? '🙈' : '👁️';
            });
        });

        function showMsg(text, type) {
            const m = document.getElementById('msg');
            m.textContent = text;
            m.className = 'message ' + (type || 'error');
            m.style.display = text ? 'block' : 'none';
        }

        let account = null;

        async function verifySession() {
            if (!GeoSession.getToken()) {
                window.location.replace(loginPage);
                return;
            }
            try {
                const res = await GeoSession.api('auth.php');
                const data = await res.json();
                if (!res.ok || data.role !== 'admin' || !data.user) {
                    GeoSession.clear();
                    window.location.replace(loginPage + '?denied=1');
                    return;
                }
                account = data.user;
                if (!account.must_change_password) {
                    // Nothing forced: they may just be here voluntarily.
                    document.getElementById('intro').textContent = 'Update the password for ' + (account.email || 'your account') + '.';
                }
            } catch (e) {
                showMsg('Could not verify your session. Refresh and try again.');
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async function () {
            const btn = this;
            const next = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (next.length < 8) { showMsg('Use at least 8 characters'); return; }
            if (next !== confirm) { showMsg('The two passwords do not match'); return; }
            GeoSession.setButtonLoading(btn, true);
            try {
                const res = await GeoSession.api('auth.php', {
                    method: 'PUT',
                    body: JSON.stringify({ action: 'password', new_password: next })
                });
                const j = await res.json();
                if (!res.ok || j.error) {
                    showMsg(j.error || 'Could not update the password');
                    GeoSession.setButtonLoading(btn, false);
                    return;
                }
                showMsg(j.message || 'Password updated. Taking you to the console…', 'success');
                const target = account && account.privilege === 'super_admin'
                    ? GeoSession.siteUrl('owner.php')
                    : 'admin.php';
                setTimeout(function () { window.location.replace(target); }, 900);
            } catch (e) {
                showMsg('Network error');
                GeoSession.setButtonLoading(btn, false);
            }
        });

        document.getElementById('confirmPassword').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') document.getElementById('saveBtn').click();
        });

        verifySession();
    </script>
</body>
</html>
