<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Geo-Lo • Organization Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f172a;--surface:#111827;--muted:#94a3b8;--text:#e5e7eb;--primary:#6366f1;--card:rgba(17,24,39,0.85);--border:1px solid rgba(148,163,184,0.15);--shadow:0 20px 40px rgba(2,6,23,0.5);--radius:18px}
        body.light{--bg:#f6f7fb;--surface:#ffffff;--muted:#64748b;--text:#0f172a;--primary:#3b82f6;--card:rgba(255,255,255,0.9);--border:1px solid rgba(100,116,139,0.15);--shadow:0 20px 40px rgba(2,6,23,0.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:radial-gradient(1200px 600px at 10% 10%,#0b1020 0%,var(--bg) 40%),radial-gradient(800px 400px at 90% 10%,#181d31 0%,transparent 45%);min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;color:var(--text)}
        .container{width:100%;max-width:480px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:var(--border)}
        .header{padding:24px 20px;text-align:center;background:linear-gradient(90deg,rgba(99,102,241,.15),rgba(99,102,241,.05))}
        .header h1{font-size:26px;margin-bottom:8px;font-weight:700}
        .header p{font-size:14px;color:var(--muted)}
        .content{padding:28px}
        .input{width:100%;padding:16px 18px;border:2px solid rgba(148,163,184,.2);border-radius:14px;margin-bottom:18px;font-size:16px;background:rgba(255,255,255,.06);color:var(--text)}
        .input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
        .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}
        .link{margin-top:14px;text-align:center;font-size:13px}
        .link a{color:#818cf8;text-decoration:none;font-weight:600}
        .hint{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}
        .message{padding:14px;border-radius:14px;margin-bottom:18px;text-align:center;display:none;font-weight:600}
        .message.error{background:#f8d7da;color:#721c24;display:block}
        .input-with-icon{position:relative}
        .input-with-icon input{padding-right:44px}
        .toggle-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--muted);padding:6px}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Organization admin</h1>
            <p>Track your company’s workers. Geo-Lo owners use a different login.</p>
        </div>
        <div class="content">
            <div id="msg" class="message"></div>
            <p class="hint">Use the email and password created when your organization was hooked onto Geo-Lo.</p>
            <input type="email" class="input" id="loginEmail" placeholder="Organization admin email" autocomplete="username" />
            <div class="input-with-icon">
                <input type="password" class="input" id="loginPassword" placeholder="Password" autocomplete="current-password" />
                <button type="button" class="toggle-btn" id="togglePass">👁️</button>
            </div>
            <button class="btn" id="loginBtn" type="button">Sign in</button>
            <div class="link"><a href="super-login.html">Geo-Lo owner login</a></div>
            <div class="link"><a href="login.html">Worker login</a></div>
        </div>
    </div>
    <script src="session.js?v=20260907render"></script>
    <script>
        (function () {
            const theme = localStorage.getItem('geo_theme') || 'dark';
            if (theme === 'light') document.body.classList.add('light');
            if (new URLSearchParams(location.search).get('denied')) {
                const msg = document.getElementById('msg');
                msg.textContent = 'This console is for organization admins. Worker accounts and the Geo-Lo owner use different logins.';
                msg.className = 'message error';
            }
            if (GeoSession.getRole() === 'worker') {
                GeoSession.clear();
            }
            if (GeoSession.getToken() && GeoSession.getRole() === 'admin') {
                const existing = GeoSession.getUser();
                if (!existing || existing.privilege === 'super_admin') {
                    fetch(GeoSession.apiUrl('auth.php'), {
                        method: 'POST',
                        headers: Object.assign({ 'Content-Type': 'application/json' }, GeoSession.headers()),
                        credentials: 'include',
                        body: JSON.stringify({ action: 'logout' })
                    }).catch(function () {});
                    GeoSession.clear();
                }
            }
            document.getElementById('togglePass').addEventListener('click', function () {
                const i = document.getElementById('loginPassword');
                i.type = i.type === 'password' ? 'text' : 'password';
                this.textContent = i.type === 'password' ? '👁️' : '🙈';
            });
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
            async function login() {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                const msg = document.getElementById('msg');
                if (!email || !password) { msg.textContent = 'Enter email and password'; msg.className = 'message error'; return; }
                try {
                    const fingerprint = await GeoSession.fingerprint();
                    const res = await fetch(GeoSession.apiUrl('auth.php'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ role: 'admin', console: 'org', email, password, device_fingerprint: fingerprint })
                    });
                    const j = await res.json();
                    if (!res.ok || j.error || j.role !== 'admin') {
                        msg.textContent = j.error || 'Invalid admin credentials';
                        msg.className = 'message error';
                        return;
                    }
                    const user = Object.assign({}, j.user || {}, { privilege: (j.user && j.user.privilege) || j.privilege || 'admin' });
                    if (user.privilege === 'super_admin') {
                        msg.textContent = 'Geo-Lo owner accounts sign in on the owner login page.';
                        msg.className = 'message error';
                        return;
                    }
                    GeoSession.set(j.token, 'admin', user);
                    window.location.replace('admin.php');
                } catch (e) {
                    msg.textContent = 'Network error';
                    msg.className = 'message error';
                }
            }
        })();
    </script>
</body>
</html>
