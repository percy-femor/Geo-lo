<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Lo • Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#071a13;--surface:#0f231a;--muted:#93b3a5;--text:#e6f2ec;--primary:#10b981;--primary-press:#059669;--card:rgba(15,35,26,0.85);--border:1px solid rgba(147,179,165,0.18);--shadow:0 20px 40px rgba(2,20,12,0.5);--radius:18px}
        body.light{--bg:#eafaf1;--surface:#ffffff;--muted:#5c7d6e;--text:#10251b;--primary:#16a34a;--primary-press:#15803d;--card:rgba(255,255,255,0.9);--border:1px solid rgba(22,163,74,0.16);--shadow:0 16px 36px rgba(16,80,50,0.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:radial-gradient(1200px 600px at 10% 10%,#0b3b2a 0%,var(--bg) 42%),radial-gradient(800px 400px at 90% 10%,#064e3b 0%,transparent 45%);min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;color:var(--text)}
        body.light{background:radial-gradient(1200px 600px at 10% 10%,#bbf7d0 0%,var(--bg) 42%),radial-gradient(800px 400px at 90% 10%,#a7f3d0 0%,transparent 45%)}
        .container{width:100%;max-width:480px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:var(--border)}
        .header{padding:24px 20px;text-align:center;background:linear-gradient(90deg,rgba(16,163,74,.15),rgba(16,163,74,.05))}
        .header h1{font-size:26px;margin-bottom:8px;font-weight:700}
        .header p{font-size:14px;opacity:.85;font-weight:500;color:var(--muted)}
        .content{padding:28px}
        .input{width:100%;padding:16px 18px;border:2px solid rgba(147,179,165,.2);border-radius:14px;margin-bottom:18px;font-size:16px;background:rgba(255,255,255,.06);color:var(--text);transition:.2s}
        body.light .input{background:rgba(22,163,74,.05);border-color:rgba(22,163,74,.18)}
        .input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(16,163,74,.15)}
        .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.4px;background:var(--primary);color:#fff}
        .btn:active{transform:scale(.98)}
        .link{margin-top:12px;text-align:center}
        .link a{color:var(--primary);text-decoration:none;font-weight:600}
        .message{padding:14px;border-radius:14px;margin-bottom:18px;text-align:center;display:none;font-weight:600}
        .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;display:block}
        .input-with-icon{position:relative}
        .input-with-icon input{padding-right:44px}
        .toggle-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:1rem;color:var(--muted);padding:6px}
    </style>
    <script src="session.js?v=20261107a"></script>
    <script>
        (function(){
            const d=localStorage.getItem('geo_theme')||'light';
            document.body?.classList?.toggle('light', d==='light');
            localStorage.removeItem('authWorker');
        })();
        window.addEventListener('DOMContentLoaded',function(){
            if(new URLSearchParams(location.search).get('denied')==='1'){
                const msg=document.getElementById('msg');
                if(msg){msg.textContent='Sign in with a worker account to open attendance.';msg.className='message error';}
            }
        });
        async function login(btn){
            const email=document.getElementById('loginEmail').value.trim();
            const pin=document.getElementById('loginPin').value.trim();
            const msg=document.getElementById('msg');
            if(!email||!pin){msg.textContent='Enter email and PIN';msg.className='message error';return}
            if(btn)GeoSession.setButtonLoading(btn,true);
            try{
                const fingerprint=await GeoSession.fingerprint();
                const res=await fetch(GeoSession.apiUrl('auth.php'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,pin,device_fingerprint:fingerprint})});
                const j=await res.json();
                if(!res.ok||j.error){msg.textContent=j.error||'Invalid credentials';msg.className='message error';if(btn)GeoSession.setButtonLoading(btn,false);return}
                GeoSession.set(j.token,'worker',j.user||j);
                window.location.href='worker.php';
            }catch(e){msg.textContent='Network error';msg.className='message error';if(btn)GeoSession.setButtonLoading(btn,false)}
        }
    </script>
    </head>
<body class="light">
    <div class="container">
        <div class="header">
            <h1>Geo-Lo Login</h1>
            <p>Access your attendance</p>
        </div>
        <div class="content">
            <div id="msg" class="message"></div>
            <input type="email" class="input" id="loginEmail" placeholder="Email" />
            <div class="input-with-icon">
                <input type="password" class="input" id="loginPin" placeholder="PIN" />
                <button type="button" class="toggle-btn" onclick="(function(el){var i=document.getElementById('loginPin');if(!i)return;var s=i.getAttribute('type')==='password';i.setAttribute('type', s?'text':'password');el.textContent=s?'🙈':'👁️';})(this)">👁️</button>
            </div>
            <button class="btn" id="loginBtn" onclick="login(this)">Login</button>
            <div class="link"><a href="reset.html">Forgot PIN or Password?</a></div>
            <div class="link"><a href="admin-login.html">Organization admin</a></div>
            <div class="link"><a href="super-login.html">Geo-Lo owner</a></div>
        </div>
    </div>
</body>
</html>
