<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Credentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#eafaf1;--surface:#ffffff;--muted:#5c7d6e;--text:#10251b;--primary:#16a34a;--primary-press:#15803d;--border:1px solid rgba(22,163,74,0.16);--shadow:0 16px 36px rgba(16,80,50,0.1);--radius:20px}
        body{font-family:'Poppins',sans-serif;background:radial-gradient(1100px 560px at 8% -10%,#bbf7d0 0%,transparent 50%),radial-gradient(900px 480px at 100% 0%,#a7f3d0 0%,transparent 42%),var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text);margin:0;padding:24px}
        .card{width:100%;max-width:520px;background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
        .header{padding:24px;background:linear-gradient(135deg,var(--primary),#34d399);color:#fff;text-align:center}
        .header h2{font-weight:700}
        .header p{opacity:.9;font-size:14px;margin-top:4px}
        .content{padding:24px}
        .group{margin-bottom:16px}
        .group label{display:block;margin-bottom:8px;font-weight:600}
        .group input{width:100%;padding:12px;border:2px solid rgba(22,163,74,.18);border-radius:12px;font-size:15px;background:rgba(22,163,74,.05);color:var(--text)}
        .group input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(16,163,74,.15)}
        .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
        .btn{padding:12px;border:none;border-radius:12px;font-weight:600;cursor:pointer}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-success{background:var(--primary-press);color:#fff}
        .message{margin-top:12px;padding:12px;border-radius:12px;text-align:center;display:none}
        .message.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
        .message.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
        .link{display:block;text-align:center;margin-top:16px;color:var(--primary);font-weight:600;text-decoration:none}
        .input-with-icon{position:relative}
        .input-with-icon input{padding-right:44px}
        .toggle-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:1rem;color:var(--muted);padding:6px}
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Reset PIN or Password</h2>
            <p>Request a token and confirm the reset</p>
        </div>
        <div class="content">
            <div class="group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="requestReset(this)">Request Reset Token</button>
                <button class="btn btn-success" onclick="confirmReset(this)">Confirm Reset</button>
            </div>
            <div class="group" style="margin-top:12px">
                <label>Reset Token</label>
                <input type="text" id="token" placeholder="Paste your reset token">
            </div>
            <div class="group">
                <label>New Password</label>
                <div class="input-with-icon">
                    <input type="password" id="newPassword" placeholder="Enter new password">
                    <button type="button" class="toggle-btn" onclick="(function(el){var i=document.getElementById('newPassword');if(!i)return;var s=i.getAttribute('type')==='password';i.setAttribute('type', s?'text':'password');el.textContent=s?'🙈':'👁️';})(this)">👁️</button>
                </div>
            </div>
            <div id="msg" class="message"></div>
            <a href="login.html" class="link">Back to login</a>
        </div>
    </div>
    <script src="session.js?v=20261107a"></script>
    <script>
        function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='message '+type;m.style.display='block'}
        async function requestReset(btn){
            const email=document.getElementById('email').value.trim();
            if(!email){showMsg('Enter your email','error');return;}
            GeoSession.setButtonLoading(btn,true);
            try{
                const res=await fetch(GeoSession.apiUrl('password_reset.php'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',email})});
                const j=await res.json();
                if(j.token){document.getElementById('token').value=j.token;}
                showMsg(j.message||j.error||'Error',j.error?'error':'success');
            }catch(e){showMsg('Network error','error');}
            GeoSession.setButtonLoading(btn,false);
        }
        async function confirmReset(btn){
            const email=document.getElementById('email').value.trim();
            const token=document.getElementById('token').value.trim();
            const newPassword=document.getElementById('newPassword').value.trim();
            if(!email||!token||!newPassword){showMsg('Provide email, token and new password','error');return;}
            GeoSession.setButtonLoading(btn,true);
            try{
                const res=await fetch(GeoSession.apiUrl('password_reset.php'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'confirm',email,token,new_password:newPassword})});
                const j=await res.json();
                showMsg(j.message||j.error||'Error',j.error?'error':'success');
            }catch(e){showMsg('Network error','error');}
            GeoSession.setButtonLoading(btn,false);
        }
    </script>
    </body>
    </html>
