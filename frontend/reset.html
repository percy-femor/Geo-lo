<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Credentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#2d3436;margin:0}
        .card{width:100%;max-width:520px;background:#fff;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.2);overflow:hidden}
        .header{padding:24px;background:linear-gradient(to right,#2c3e50,#3498db);color:#fff;text-align:center}
        .content{padding:24px}
        .group{margin-bottom:16px}
        .group label{display:block;margin-bottom:8px;font-weight:600}
        .group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;background:#f8f9fa}
        .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
        .btn{padding:12px;border:none;border-radius:12px;font-weight:600;cursor:pointer}
        .btn-primary{background:#3498db;color:#fff}
        .btn-success{background:#2ecc71;color:#fff}
        .message{margin-top:12px;padding:12px;border-radius:12px;text-align:center;display:none}
        .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .link{display:block;text-align:center;margin-top:16px;color:#3498db;font-weight:600;text-decoration:none}
        .input-with-icon{position:relative}
        .input-with-icon input{padding-right:44px}
        .toggle-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:1rem;color:#2d3436;padding:6px}
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Reset PIN or Password</h2>
            <p>Request a token and confirm the reset</p>
        </div>
        <div class="content">
            <div class="group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="requestReset()">Request Reset Token</button>
                <button class="btn btn-success" onclick="confirmReset()">Confirm Reset</button>
            </div>
            <div class="group" style="margin-top:12px">
                <label>Reset Token</label>
                <input type="text" id="token" placeholder="Paste your reset token">
            </div>
            <div class="group">
                <label>New Password</label>
                <div class="input-with-icon">
                    <input type="password" id="newPassword" placeholder="Enter new password">
                    <button type="button" class="toggle-btn" onclick="(function(el){var i=document.getElementById('newPassword');if(!i)return;var s=i.getAttribute('type')==='password';i.setAttribute('type', s?'text':'password');el.textContent=s?'🙈':'👁️';})(this)">👁️</button>
                </div>
            </div>
            <div id="msg" class="message"></div>
            <a href="login.html" class="link">Back to login</a>
        </div>
    </div>
    <script src="session.js?v=20260907render"></script>
    <script>
        function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='message '+type;m.style.display='block'}
        async function requestReset(){const email=document.getElementById('email').value.trim();if(!email){showMsg('Enter your email','error');return;}const res=await fetch(GeoSession.apiUrl('password_reset.php'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',email})});const j=await res.json();if(j.token){document.getElementById('token').value=j.token;}showMsg(j.message||j.error||'Error',j.error?'error':'success')}
        async function confirmReset(){const email=document.getElementById('email').value.trim();const token=document.getElementById('token').value.trim();const newPassword=document.getElementById('newPassword').value.trim();if(!email||!token||!newPassword){showMsg('Provide email, token and new password','error');return;}const res=await fetch(GeoSession.apiUrl('password_reset.php'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'confirm',email,token,new_password:newPassword})});const j=await res.json();showMsg(j.message||j.error||'Error',j.error?'error':'success')}
    </script>
    </body>
    </html>
