ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend
    Alias /api /var/www/html/api

    <Directory /var/www/html/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex login.html index.php
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>

    PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_SSL DB_SSL_CA APP_URL RENDER_EXTERNAL_URL
</VirtualHost>
