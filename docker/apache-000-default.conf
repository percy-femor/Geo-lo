ServerName localhost

<VirtualHost *:80>
    # Marketing site: landing page, "Get Started" onboarding form, payment
    # verification and the owner console.
    DocumentRoot /var/www/html/website

    # Application consoles: worker app, organization admin and Geo-Lo owner.
    Alias /app /var/www/html/frontend
    Alias /api /var/www/html/api

    <Directory /var/www/html/website>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <Directory /var/www/html/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex login.html index.php
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>

    PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_SSL DB_SSL_CA APP_URL RENDER_EXTERNAL_URL
    PassEnv PAYSTACK_PUBLIC_KEY PAYSTACK_SECRET_KEY RESEND_API_KEY MAIL_FROM
    PassEnv OWNER_PASSWORD OWNER_RECOVERY_EMAIL APP_ENV APP_TIMEZONE
</VirtualHost>
