upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M
; Baseline zone; APP_TIMEZONE (read in api/config.php) overrides it at runtime and the
; MySQL session is pinned to the same offset.
date.timezone = UTC

; Production safety: a PHP warning printed mid-response breaks the JSON the frontends
; parse, so keep errors out of the body and send them to the container log instead.
display_errors = Off
log_errors = On
error_log = /dev/stderr
